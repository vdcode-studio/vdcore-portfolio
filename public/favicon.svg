<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Pozadina sa zaobljenim ivicama -->
  <rect width="512" height="512" rx="110" fill="#090d16" />
  <rect width="512" height="512" rx="110" fill="none" stroke="#312e81" stroke-width="16" opacity="0.6" />

  <!-- Terminalski znak (>_) - veći i jasniji -->
  <text x="65" y="165" font-family="monospace" font-weight="900" font-size="110" fill="#94a3b8">&gt;_</text>

  <!-- Glavni inicijali VD - krupni i dominantni -->
  <text x="55" y="380" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="240" fill="#6366f1" letter-spacing="-8">VD</text>

  <!-- Kontrastna tačka u Amber/Zlatnoj boji -->
  <circle cx="435" cy="335" r="28" fill="#fbbf24" />
</svg>
