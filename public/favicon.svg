<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <style>
    .bg-sq { fill: #070b14; }
    .mark-v {
      fill: none;
      stroke: url(#neonGrad);
      stroke-width: 9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .core-dot { fill: #38bdf8; }

    @media (prefers-color-scheme: light) {
      .bg-sq { fill: #f8fafc; }
    }
  </style>

  <!-- Podloga -->
  <rect x="5" y="5" width="90" height="90" rx="28" class="bg-sq" />

  <!-- Oštar V simbol -->
  <path d="M 24 32 L 50 72 L 76 32" class="mark-v" />
  
  <!-- "Core" plava tačka u sredini gore -->
  <circle cx="50" cy="30" r="5.5" class="core-dot" />
</svg>
