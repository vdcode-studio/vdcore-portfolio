<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Pozadina sa zaobljenim ivicama -->
  <rect width="512" height="512" rx="110" fill="#090d16" />
  <rect width="512" height="512" rx="110" fill="none" stroke="#312e81" stroke-width="16" opacity="0.6" />

  <!-- Terminalski znak (>_) u sivo-beloj tonu -->
  <text x="75" y="195" font-family="monospace" font-weight="900" font-size="140" fill="#94a3b8">&gt;_</text>

  <!-- Glavni inicijali VD u Indigo-plavoj boji -->
  <text x="75" y="380" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="190" fill="#6366f1" letter-spacing="-5">VD</text>

  <!-- Mala kontrastna tačka u Amber/Zlatnoj boji -->
  <circle cx="410" cy="340" r="22" fill="#fbbf24" />
</svg>
